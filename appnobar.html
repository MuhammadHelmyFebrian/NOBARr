<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nobar P2P — Watch Party</title>
<style>
  :root {
    --bg-main: #0f1117;
    --bg-card: #181b24;
    --bg-input: #222633;
    --border: #2e3446;
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    line-height: 1.5;
  }

  /* Header */
  header {
    background-color: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.2rem;
    font-weight: 700;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-input);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    border: 1px solid var(--border);
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: var(--danger);
  }
  .dot.connecting { background-color: var(--warning); }
  .dot.connected { background-color: var(--success); box-shadow: 0 0 8px var(--success); }

  /* Main Layout */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 20px;
    max-width: 1440px;
    margin: 20px auto;
    padding: 0 20px;
  }

  @media (max-width: 1024px) {
    .main-grid {
      grid-template-columns: 1fr;
    }
  }

  .card {
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
  }

  .card-title {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-main);
  }

  /* Buttons */
  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  button {
    padding: 9px 14px;
    border: none;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    background-color: var(--bg-input);
    color: var(--text-main);
    border: 1px solid var(--border);
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  button:hover:not(:disabled) {
    background-color: #2c3142;
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  button.primary {
    background-color: var(--primary);
    border-color: var(--primary);
    color: white;
  }
  button.primary:hover:not(:disabled) {
    background-color: var(--primary-hover);
  }

  button.success {
    background-color: var(--success);
    border-color: var(--success);
    color: #06281e;
  }

  button.danger {
    background-color: rgba(239, 68, 68, 0.15);
    border-color: var(--danger);
    color: #fca5a5;
  }

  /* Movie Player */
  .movie-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .file-label {
    background-color: var(--primary);
    color: white;
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .file-label:hover { background-color: var(--primary-hover); }
  #videoFile { display: none; }

  .nobar-video {
    width: 100%;
    max-height: 540px;
    background: #000;
    border-radius: 10px;
    outline: none;
  }

  /* Webcams Grid */
  .cam-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .cam-box {
    position: relative;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    aspect-ratio: 16 / 9;
    border: 1px solid var(--border);
  }

  .cam-box video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .cam-label {
    position: absolute;
    bottom: 8px;
    left: 8px;
    background: rgba(0, 0, 0, 0.65);
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
  }

  /* Signaling Area */
  textarea {
    width: 100%;
    height: 85px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-main);
    padding: 10px;
    font-family: monospace;
    font-size: 0.8rem;
    resize: vertical;
    margin: 10px 0;
  }

  .hint {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Chat Area */
  .chat-container {
    display: flex;
    flex-direction: column;
    height: 440px;
  }

  #chatBox {
    flex: 1;
    background: var(--bg-main);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }

  .msg {
    max-width: 82%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 0.88rem;
    word-wrap: break-word;
  }

  .msg.me {
    align-self: flex-end;
    background: var(--primary);
    color: white;
    border-bottom-right-radius: 2px;
  }

  .msg.peer {
    align-self: flex-start;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-bottom-left-radius: 2px;
  }

  .msg.sys {
    align-self: center;
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(99, 102, 241, 0.25);
    color: #c7d2fe;
    font-size: 0.78rem;
    text-align: center;
    border-radius: 8px;
    padding: 5px 10px;
  }

  .chat-input-row {
    display: flex;
    gap: 8px;
  }

  input[type="text"] {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text-main);
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--primary);
  }
</style>
</head>
<body>

<header>
  <div class="brand">🎬 Nobar P2P</div>
  <div class="status-badge">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Terputus</span>
  </div>
</header>

<div class="main-grid">
  <!-- KOLOM KIRI: Pemutar Film & Webcam -->
  <div>
    <!-- Pemutar Film -->
    <div class="card">
      <div class="movie-header">
        <div>
          <h3 style="font-size:1rem;">Layar Utama Nobar</h3>
          <p class="hint" id="fileName">Belum ada video dipilih</p>
        </div>
        <div class="btn-group">
          <label for="videoFile" class="file-label" id="fileLabel">📂 Pilih / Ganti Video</label>
          <input type="file" id="videoFile" accept="video/*">
          <button id="clearVideoBtn" class="danger" style="display:none;" title="Hapus video saat ini">🗑️ Tutup Video</button>
          <button id="syncBtn" title="Samakan waktu video ke teman">🔄 Paksa Sync</button>
        </div>
      </div>
      <video id="movie" class="nobar-video" controls></video>
    </div>

    <!-- Webcam / Share Screen -->
    <div class="card">
      <div class="card-title">
        <span>Kamera & Layar</span>
        <div class="btn-group">
          <button id="cameraBtn">📷 Nyalakan Kamera</button>
          <button id="toggleMicBtn" disabled>🎤 Mic On</button>
          <button id="toggleCamBtn" disabled>📹 Cam On</button>
          <button id="screenBtn">🖥️ Share Screen</button>
        </div>
      </div>

      <div class="cam-grid">
        <div class="cam-box">
          <video id="localVideo" autoplay muted playsinline></video>
          <span class="cam-label">Kamu</span>
        </div>
        <div class="cam-box">
          <video id="remoteVideo" autoplay playsinline></video>
          <span class="cam-label">Teman</span>
        </div>
      </div>
    </div>
  </div>

  <!-- KOLOM KANAN: Koneksi Room & Chat -->
  <div>
    <!-- Panel Koneksi P2P -->
    <div class="card">
      <div class="card-title">
        <span>Koneksi Room (P2P)</span>
        <button id="copyBtn" style="padding:4px 10px; font-size:0.78rem;">📋 Salin Kode</button>
      </div>

      <div class="btn-group">
        <button id="createBtn" class="primary">1. Buat Room (Offer)</button>
        <button id="joinBtn">2. Gabung (Answer)</button>
        <button id="connectBtn" class="success">3. Hubungkan</button>
      </div>

      <textarea id="signal" placeholder="Kode Offer / Answer akan muncul di sini..."></textarea>
      <p class="hint">
        <b>Cara konek:</b> Host klik <i>Buat Room</i> → Salin & kirim ke teman. Teman paste kode → klik <i>Gabung</i> → kirim balik hasilnya ke Host. Host paste → klik <i>Hubungkan</i>.
      </p>
    </div>

    <!-- Panel Chat -->
    <div class="card chat-container">
      <div class="card-title">💬 Live Chat</div>
      <div id="chatBox"></div>
      <div class="chat-input-row">
        <input type="text" id="messageInput" placeholder="Ketik pesan lalu Enter...">
        <button id="sendBtn" class="primary">Kirim</button>
      </div>
    </div>
  </div>
</div>

<script>
  let pc = null;
  let dc = null;
  let localStream = null;
  let isRemoteAction = false;
  let currentVideoURL = null; // Menyimpan URL blob agar bisa dibersihkan saat ganti video

  const signalEl = document.getElementById("signal");
  const localVideo = document.getElementById("localVideo");
  const remoteVideo = document.getElementById("remoteVideo");
  const movie = document.getElementById("movie");
  const chatBox = document.getElementById("chatBox");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const fileNameEl = document.getElementById("fileName");
  const clearVideoBtn = document.getElementById("clearVideoBtn");
  const videoFileInput = document.getElementById("videoFile");

  function setStatus(state, text) {
    statusDot.className = "dot " + state;
    statusText.textContent = text;
  }

  function addChat(text, type = "sys") {
    const div = document.createElement("div");
    div.className = `msg ${type}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function sendData(payload) {
    if (dc && dc.readyState === "open") {
      dc.send(JSON.stringify(payload));
    }
  }

  function createPeer() {
    if (pc) return;
    pc = new RTCPeerConnection({
      iceServers: [
        { urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }
      ]
    });

    pc.ontrack = (e) => {
      remoteVideo.srcObject = e.streams[0];
    };

    pc.onicecandidate = (e) => {
      if (!e.candidate && pc.localDescription) {
        signalEl.value = JSON.stringify(pc.localDescription);
      }
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "connected") {
        setStatus("connected", "Tersambung");
      } else if (pc.connectionState === "disconnected" || pc.connectionState === "failed") {
        setStatus("", "Terputus");
        addChat("Koneksi terputus.", "sys");
      }
    };

    pc.ondatachannel = (e) => {
      dc = e.channel;
      setupChannel();
    };

    if (localStream) {
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    }
  }

  function setupChannel() {
    dc.onopen = () => {
      setStatus("connected", "Tersambung");
      addChat("Terhubung dengan teman! Selamat nobar 🍿", "sys");
    };

    dc.onmessage = (e) => {
      const data = JSON.parse(e.data);

      if (data.type === "chat") {
        addChat(data.message, "peer");
      } else if (data.type === "play") {
        isRemoteAction = true;
        if (Math.abs(movie.currentTime - data.time) > 0.5) {
          movie.currentTime = data.time;
        }
        movie.play().catch(() => {});
        setTimeout(() => isRemoteAction = false, 200);
      } else if (data.type === "pause") {
        isRemoteAction = true;
        movie.currentTime = data.time;
        movie.pause();
        setTimeout(() => isRemoteAction = false, 200);
      } else if (data.type === "seek") {
        isRemoteAction = true;
        movie.currentTime = data.time;
        setTimeout(() => isRemoteAction = false, 200);
      } else if (data.type === "video_changed") {
        // Teman mengganti video: reset posisi waktu dan beri tahu di chat
        isRemoteAction = true;
        movie.pause();
        movie.currentTime = 0;
        setTimeout(() => isRemoteAction = false, 200);
        addChat(`📢 Teman mengganti video ke: "${data.fileName}". Pilih file yang sama agar sinkron!`, "sys");
      }
    };
  }

  // Kamera & Mic
  document.getElementById("cameraBtn").onclick = async () => {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = localStream;
      document.getElementById("toggleMicBtn").disabled = false;
      document.getElementById("toggleCamBtn").disabled = false;

      if (pc) {
        localStream.getTracks().forEach(track => {
          const sender = pc.getSenders().find(s => s.track && s.track.kind === track.kind);
          if (sender) sender.replaceTrack(track);
          else pc.addTrack(track, localStream);
        });
      }
      addChat("Kamera & Mic aktif.", "sys");
    } catch (err) {
      alert("Gagal mengakses kamera: " + err.message);
    }
  };

  // Mute / Unmute Mic
  document.getElementById("toggleMicBtn").onclick = (e) => {
    if (!localStream) return;
    const audioTrack = localStream.getAudioTracks()[0];
    if (audioTrack) {
      audioTrack.enabled = !audioTrack.enabled;
      e.target.textContent = audioTrack.enabled ? "🎤 Mic On" : "🔇 Mic Off";
      e.target.classList.toggle("danger", !audioTrack.enabled);
    }
  };

  // On / Off Kamera
  document.getElementById("toggleCamBtn").onclick = (e) => {
    if (!localStream) return;
    const videoTrack = localStream.getVideoTracks()[0];
    if (videoTrack) {
      videoTrack.enabled = !videoTrack.enabled;
      e.target.textContent = videoTrack.enabled ? "📹 Cam On" : "🚫 Cam Off";
      e.target.classList.toggle("danger", !videoTrack.enabled);
    }
  };

  // Share Screen
  document.getElementById("screenBtn").onclick = async () => {
    try {
      const displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      localVideo.srcObject = displayStream;
      const screenTrack = displayStream.getVideoTracks()[0];

      if (pc) {
        const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
        if (sender) sender.replaceTrack(screenTrack);
        else pc.addTrack(screenTrack, displayStream);
      }

      screenTrack.onended = () => {
        if (localStream) {
          localVideo.srcObject = localStream;
          const camTrack = localStream.getVideoTracks()[0];
          const sender = pc?.getSenders().find(s => s.track && s.track.kind === "video");
          if (sender && camTrack) sender.replaceTrack(camTrack);
        }
      };
    } catch (err) {
      alert("Share screen dibatalkan: " + err.message);
    }
  };

  // 1. Buat Room (Host)
  document.getElementById("createBtn").onclick = async () => {
    createPeer();
    dc = pc.createDataChannel("nobar");
    setupChannel();
    setStatus("connecting", "Menunggu Teman...");

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    signalEl.value = JSON.stringify(pc.localDescription);
    addChat("Room dibuat. Salin kode dan kirim ke teman.", "sys");
  };

  // 2. Gabung Room (Guest)
  document.getElementById("joinBtn").onclick = async () => {
    try {
      const offerData = JSON.parse(signalEl.value.trim());
      createPeer();
      setStatus("connecting", "Menghubungkan...");

      await pc.setRemoteDescription(offerData);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      signalEl.value = JSON.stringify(pc.localDescription);
      addChat("Kode Answer siap! Salin dan kirim balik ke Host.", "sys");
    } catch (e) {
      alert("Kode Offer tidak valid! Pastikan kamu sudah mem-paste kode dari Host.");
    }
  };

  // 3. Hubungkan (Host menerima Answer)
  document.getElementById("connectBtn").onclick = async () => {
    try {
      const answerData = JSON.parse(signalEl.value.trim());
      if (!pc) return alert("Klik 'Buat Room' terlebih dahulu.");
      await pc.setRemoteDescription(answerData);
    } catch (e) {
      alert("Kode Answer tidak valid!");
    }
  };

  // Salin Kode
  document.getElementById("copyBtn").onclick = () => {
    if (!signalEl.value) return;
    navigator.clipboard.writeText(signalEl.value);
    const btn = document.getElementById("copyBtn");
    btn.textContent = "✅ Tersalin!";
    setTimeout(() => btn.textContent = "📋 Salin Kode", 1500);
  };

  // Chat
  function handleSendChat() {
    const input = document.getElementById("messageInput");
    const msg = input.value.trim();
    if (!msg) return;

    addChat(msg, "me");
    sendData({ type: "chat", message: msg });
    input.value = "";
  }

  document.getElementById("sendBtn").onclick = handleSendChat;
  document.getElementById("messageInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") handleSendChat();
  });

  // Pilih atau Ganti Video Kapan Saja
  videoFileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    // 1. Hentikan video lama & bersihkan memori blob sebelumnya
    isRemoteAction = true;
    movie.pause();
    if (currentVideoURL) {
      URL.revokeObjectURL(currentVideoURL);
    }

    // 2. Muat video baru dan reset waktu ke 0
    currentVideoURL = URL.createObjectURL(file);
    movie.src = currentVideoURL;
    movie.currentTime = 0;
    movie.load();

    // 3. Update tampilan UI
    fileNameEl.textContent = "🎞️ Sedang dimuat: " + file.name;
    clearVideoBtn.style.display = "inline-flex";
    addChat(`Kamu memilih video: ${file.name}`, "sys");

    // 4. Beri tahu teman bahwa video telah diganti
    sendData({ type: "video_changed", fileName: file.name });

    // 5. Reset input file agar bisa memilih ulang file yang sama jika diperlukan
    e.target.value = "";
    setTimeout(() => isRemoteAction = false, 200);
  };

  // Tombol Tutup / Hapus Video
  clearVideoBtn.onclick = () => {
    isRemoteAction = true;
    movie.pause();
    if (currentVideoURL) {
      URL.revokeObjectURL(currentVideoURL);
      currentVideoURL = null;
    }
    movie.removeAttribute("src");
    movie.load();
    fileNameEl.textContent = "Belum ada video dipilih";
    clearVideoBtn.style.display = "none";
    addChat("Video ditutup.", "sys");
    setTimeout(() => isRemoteAction = false, 200);
  };

  // Event Sinkronisasi Player
  movie.addEventListener("play", () => {
    if (!isRemoteAction && movie.src) {
      sendData({ type: "play", time: movie.currentTime });
    }
  });

  movie.addEventListener("pause", () => {
    if (!isRemoteAction && movie.src) {
      sendData({ type: "pause", time: movie.currentTime });
    }
  });

  movie.addEventListener("seeked", () => {
    if (!isRemoteAction && movie.src) {
      sendData({ type: "seek", time: movie.currentTime });
    }
  });

  document.getElementById("syncBtn").onclick = () => {
    if (!movie.src) return alert("Pilih video terlebih dahulu!");
    sendData({ type: movie.paused ? "pause" : "play", time: movie.currentTime });
    addChat(`Sinkronisasi dikirim di detik ke-${Math.floor(movie.currentTime)}s`, "sys");
  };
</script>

</body>
</html>
